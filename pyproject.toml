[project]
name = "godot-docs"
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygments (==2.19.2)",
    "sphinx (==8.1.3)",
    "sphinx-rtd-theme (==3.1.0)",
    "sphinx-tabs (==3.4.7)",
    "sphinx-copybutton (==0.5.2)",
    "sphinx-notfound-page (==1.1.0)",
    "sphinxext-opengraph (==0.13.0)",
    "sphinxcontrib-video (==0.4.2)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 120

[tool.codespell]
enable-colors = true
write-changes = true
check-hidden = true
quiet-level = 3
dictionary = ["_tools/codespell-dict.txt", "-"]
builtin = ["clear", "rare", "en-GB_to_en-US"]
skip = [
    "_static/css/*",
    "_styleguides/*",
    "classes/*",
    "tutorials/i18n/locales.rst",
    "AUTHORS.md",
    "LICENSE.txt",
]
ignore-words-list = [
    "dialogue",     # Common even in US spelling.
    "findn",        # Our case-insensitive `find` function.
    "inout",        # Shader attribute.
    "lod",          # "Level of Detail".
    "marshalled",   # Common spelling in IT.
    "marshalling",  # Common spelling in IT.
    "thirdparty",   # Prefer as one word.
    "uint",         # "Unsigned integer".
]
ignore-multiline-regex = "codespell:ignore-begin.*?codespell:ignore-end"
